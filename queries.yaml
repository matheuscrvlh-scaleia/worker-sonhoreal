# O que o worker-fdc copia do ERP da Sonho Real (Firebird) para o Supabase.
#
#   sincronizar:  cada item é uma tabela fdc.<nome> no Supabase (supabase/migrations). O SQL
#                 roda inteiro a cada intervalo_minutos; o worker compara o hash de cada linha
#                 com o que já mandou e envia só o que mudou (e apaga o que sumiu).
#                 As colunas do SQL têm o mesmo nome das colunas da tabela no Supabase; coluna
#                 a mais é ignorada lá (serve para a chave). Coluna nova: migração + SQL aqui.
#   consultas:    diagnósticos. Não vão para a IA: rodam quando a equipe pede pelo Supabase
#                 (POST /admin/comandos) ou no "worker-fdc.exe -testar".
#
# As perguntas da IA (buscar_produto, parcelas_em_aberto...) agora são funções fdc.q_* no
# Supabase e leem a cópia; o catálogo fica em supabase/functions/fdc/consultas.ts.
#
# Regras de Firebird seguidas aqui (não remova):
#   - parâmetro comparado com coluna CHAR/VARCHAR vai com CAST(:x AS VARCHAR(n)),
#     senão um valor maior que a coluna dá "string truncation";
#   - nada de ":x IS NULL" (o 2.5 não descobre o tipo do parâmetro);
#   - CONTAINING não diferencia maiúscula/minúscula e "CONTAINING ''" é sempre verdadeiro.
#
# O que o banco da Sonho Real mostrou (diagnóstico de 26/10/2026, Firebird 3.0.10, charset NONE):
#   - sim/não é gravado como 'T'/'F' (não 'S'/'N'). Aqui aceitamos os dois:
#     sim = IN ('S', 'T'), não = NOT IN ('S', 'T'). Para o Supabase vai sempre 'S'/'N';
#   - RECEBER.VALORPAGO nunca é preenchido: o que diz se o título está pago é o STATUS
#     ('0' = em aberto, ver diag_status);
#   - PEDIDOVENDA, ASSISTENCIA e PRODUTOPROMOCAO estão vazias: a venda é lançada direto em SAIDA;
#   - CPF gravado só com dígitos; descrições em maiúsculas e sem acento;
#   - lojas: 01 Bom Jardim/RJ (principal), 02 São José do Calçado/ES; CD, EC, EN são internas.
#
# Views do fornecedor do ERP (FDC Campos), que mostram a regra oficial (diag_views):
#   - VIEWESTOQUE: o saldo é ESTOQUE.QTDER (a coluna ESTOQUE.ESTOQUE não é usada);
#   - VIEWPRODUTOS: ATIVO = 'T', preço de venda = PRECOAVISTA, marca = FABRICANTE.NOMEFABRICANTE
#     (PRODUTOMARCA está vazia);
#   - VIEWFATURAMENTO: venda válida = SAIDA.STATUS 'A' e TIPOSAIDA '1', '2' ou '9'; item com
#     IDPRODUTOREFERENCIA é garantia estendida, não produto.
#
# Este arquivo é relido sozinho quando muda (sem reiniciar o worker). Se o arquivo novo tiver
# erro, o worker continua com o anterior e o erro aparece no worker_status do Supabase.
# Depois de mexer, rode "worker-fdc.exe -testar" na máquina do cliente.

sincronizar:

  # ============================================================ PRODUTOS

  # Só ativos. A vigência da promoção é conferida no Supabase (fdc.hoje()), para uma promoção
  # que acabou não continuar valendo se o PC da loja ficar desligado.
  produto:
    chave: [codigo]
    intervalo_minutos: 10
    sql: |
      SELECT
        p.IDPRODUTO         AS codigo,
        p.DESCRICAOPRODUTO  AS descricao,
        CASE WHEN p.FORADELINHA IN ('S', 'T') THEN 'S' ELSE 'N' END AS fora_de_linha,
        fa.NOMEFABRICANTE   AS marca,  -- PRODUTOMARCA é vazia e o FDCRELATORIO não lê
        g.NOMEGRUPO         AS grupo,
        sg.NOMESUBGRUPO     AS subgrupo,
        p.REFERENCIAFABRICA AS referencia,
        p.EAN               AS ean,
        p.UNIDADEMEDIDA     AS unidade,
        p.PRECOAVISTA       AS preco_avista,
        p.PRECOAPRAZO       AS preco_aprazo,
        CASE WHEN p.PROMOCAO IN ('S', 'T') AND p.PRECOPROMOCAO > 0 THEN p.PRECOPROMOCAO END AS promocao_preco,
        CAST(p.DATAINICIOPROMOCAO AS DATE) AS promocao_inicio,
        CAST(p.DATAFIMPROMOCAO AS DATE)    AS promocao_fim,
        p.ALTURA            AS altura,
        p.LARGURA           AS largura,
        p.COMPRIMENTO       AS comprimento,
        p.GARANTIAFABRICA   AS garantia_fabrica,
        p.APLICACAO         AS aplicacao,
        w.DESCRICAOPRODUTOWEB AS descricao_site,
        w.DADOSTECNICOS     AS dados_tecnicos,
        w.ITENSINCLUSOS     AS itens_inclusos,
        CASE WHEN p.TEMMONTAGEM IN ('S', 'T') THEN 'S' ELSE 'N' END    AS tem_montagem,
        CASE WHEN w.MONTAGEMGRATIS IN ('S', 'T') THEN 'S' ELSE 'N' END AS montagem_gratis,
        CASE WHEN w.FRETEGRATIS IN ('S', 'T') THEN 'S' ELSE 'N' END    AS frete_gratis,
        CASE WHEN p.NAOTEMDESCONTO IN ('S', 'T') THEN 'N' ELSE 'S' END AS aceita_desconto,
        CASE WHEN p.NAOTEMDESCONTO IN ('S', 'T') OR g.PROIBIRDESCONTO IN ('S', 'T')
             THEN 'S' ELSE 'N' END AS sem_desconto,
        g.PERCDESCONTO      AS desconto_grupo
      FROM PRODUTO p
      LEFT JOIN FABRICANTE fa  ON fa.IDFABRICANTE = p.IDFABRICANTE
      LEFT JOIN GRUPO g        ON g.IDGRUPO = p.IDGRUPO
      LEFT JOIN SUBGRUPO sg    ON sg.IDSUBGRUPO = p.IDSUBGRUPO
      LEFT JOIN PRODUTOWEB w   ON w.IDPRODUTO = p.IDPRODUTO
      WHERE COALESCE(p.ATIVO, 'T') IN ('S', 'T')

  # Só saldos > 0 de produtos ativos. Saldo que zera some do Supabase.
  estoque:
    chave: [codigo, filial]
    intervalo_minutos: 5
    sql: |
      SELECT e.IDPRODUTO AS codigo, e.IDFILIAL AS filial, e.QTDER AS estoque
      FROM ESTOQUE e
      JOIN PRODUTO p ON p.IDPRODUTO = e.IDPRODUTO
      WHERE e.QTDER > 0 AND COALESCE(p.ATIVO, 'T') IN ('S', 'T')
        AND e.IDFILIAL NOT IN ('EN', 'EC')  -- controle interno do sistema (FDC, 13/11/2026)

  # promocao (PRODUTOPROMOCAO, promoção por loja) saiu: a tabela é vazia e o FDCRELATORIO não
  # a lê. Se a loja passar a usar, pedir o GRANT e voltar com a extração (está no git).

  # Cada linha é uma foto: o worker lê o binário com sql_arquivo, reduz se passar de 1 MB e
  # sobe para o Storage (bucket "fotos"). Tamanho e DA (data de alteração) mudam o hash, e
  # assim a foto trocada no ERP é reenviada.
  foto:
    tipo: foto
    chave: [codigo, seq]
    intervalo_minutos: 60
    sql: |
      SELECT pf.IDPRODUTO AS codigo, pf.SEQ AS seq, OCTET_LENGTH(pf.FOTO) AS bytes_erp, pf.DA AS da
      FROM PRODUTOFOTO pf
      JOIN PRODUTO p ON p.IDPRODUTO = pf.IDPRODUTO
      WHERE pf.FOTO IS NOT NULL AND COALESCE(p.ATIVO, 'T') IN ('S', 'T')
    sql_arquivo: |
      SELECT pf.FOTO FROM PRODUTOFOTO pf WHERE pf.IDPRODUTO = :codigo AND pf.SEQ = :seq

  # ============================================================ PAGAMENTO

  # Ativas, sem renegociação e sem exclusivas de cliente; a validade é conferida no Supabase.
  condicao:
    chave: [codigo]
    intervalo_minutos: 30
    sql: |
      SELECT
        c.IDCONDPGVENDA        AS codigo,
        c.DESCRICAOCONDPGVENDA AS descricao,
        COALESCE(NULLIF(c.PARCELA, 0),
                 NULLIF(  CASE WHEN c.DIAS1 IS NOT NULL THEN 1 ELSE 0 END + CASE WHEN c.DIAS2 IS NOT NULL THEN 1 ELSE 0 END
                        + CASE WHEN c.DIAS3 IS NOT NULL THEN 1 ELSE 0 END + CASE WHEN c.DIAS4 IS NOT NULL THEN 1 ELSE 0 END
                        + CASE WHEN c.DIAS5 IS NOT NULL THEN 1 ELSE 0 END + CASE WHEN c.DIAS6 IS NOT NULL THEN 1 ELSE 0 END
                        + CASE WHEN c.DIAS7 IS NOT NULL THEN 1 ELSE 0 END + CASE WHEN c.DIAS8 IS NOT NULL THEN 1 ELSE 0 END
                        + CASE WHEN c.DIAS9 IS NOT NULL THEN 1 ELSE 0 END + CASE WHEN c.DIAS10 IS NOT NULL THEN 1 ELSE 0 END, 0),
                 1) AS parcelas,
        CASE WHEN c.ENTRADA IN ('S', 'T') THEN 'S' ELSE 'N' END AS com_entrada,
        COALESCE(NULLIF(c.FATOR, 0), 1) AS fator,
        c.PERCDESCONTO      AS desconto_perc,
        c.PARCELAMINIMA     AS parcela_minima,
        c.PERCMINIMOENTRADA AS entrada_minima_perc,
        CAST(c.DATAINICIO AS DATE) AS inicio,
        CAST(c.DATAFINAL AS DATE)  AS fim
      FROM CONDPGVENDA c
      WHERE COALESCE(c.ATIVO, 'T') IN ('S', 'T')
        AND COALESCE(c.RENEGOCIACAO, 'F') NOT IN ('S', 'T')
        AND COALESCE(c.EXCLUSIVA_CLIENTE, 'F') NOT IN ('S', 'T')

  # condicao_fator (CONDPGVENDAFATORFILIAL, fator por loja) saiu: a FDC disse que a Sonho Real
  # não usa (13/11/2026) e o FDCRELATORIO não a lê.

  # ============================================================ LOJA

  # Todas as filiais, inclusive depósito (estoque_por_loja mostra o nome). A consulta lojas
  # do Supabase só mostra as que têm endereço. Lê a VIEWFILIAL (mesmas colunas da FILIAL), que é
  # o que a FDC liberou.
  loja:
    chave: [filial]
    intervalo_minutos: 60
    sql: |
      SELECT
        f.IDFILIAL AS filial,
        COALESCE(f.NOMEFANTASIA, f.NOMEFILIAL) AS nome,
        f.ENDERECO AS endereco,
        f.NUMERO   AS numero,
        f.BAIRRO   AS bairro,
        f.CIDADE   AS cidade,
        f.UF       AS uf,
        f.CEP      AS cep,
        f.TELEFONES AS telefones,
        f.EMAIL    AS email,
        f.ORDEMEXIBICAO AS ordem
      FROM VIEWFILIAL f

  # ============================================================ CLIENTE
  #
  # Dado pessoal (LGPD): no Supabase fica num schema que não é exposto e só a Edge Function lê.

  cliente:
    chave: [documento]
    intervalo_minutos: 30
    sql: |
      SELECT
        c.DOCTOCLIENTE  AS documento,
        c.NOMECLIENTE   AS nome,
        c.EMAIL         AS email,
        c.CELULAR       AS celular,
        c.TELEFONES     AS telefones,
        c.TELEFONEALTERNATIVO AS telefone_alternativo,
        -- telefones_extra (tabela TELEFONES) vai NULL até a FDC dar o GRANT ao FDCRELATORIO.
        c.ENDERECO      AS endereco,
        c.NUMERO        AS numero,
        c.COMPLEMENTO   AS complemento,
        c.BAIRRO        AS bairro,
        c.CIDADE        AS cidade,
        c.UF            AS uf,
        c.CEP           AS cep,
        CAST(c.DATACADASTRO AS DATE)     AS cliente_desde,
        CAST(c.DATAULTIMACOMPRA AS DATE) AS ultima_compra,
        c.VALORULTIMACOMPRA AS valor_ultima_compra,
        c.LIMITECREDITO     AS limite_credito,
        s.NOMESITUACAO      AS situacao,
        CASE WHEN COALESCE(c.ATIVO, 'T') IN ('S', 'T') THEN 'S' ELSE 'N' END AS ativo
      FROM CLIENTE c
      LEFT JOIN SITUACAO s ON s.IDSITUACAO = c.IDSITUACAO

  # Títulos em aberto. Regra da FDC (13/11/2026): STATUS '0' aberto, '1' quitado, '2' pago em
  # parte. valor = o que falta: RECEBER.VALOR menos as baixas da RECEBIDO que abatem o título
  # (TIPO 1 quitação, 2 parcial, 3 desconto); 4 juros e 8 encargos não abatem. Conferir o
  # formato do TIPO (CHAR(2)) com diag_recebido_tipo. Título pago some do Supabase; por isso o
  # limite de remoção é maior que o padrão (um dia de muitos pagamentos não deve travar).
  parcela:
    chave: [filial, titulo]
    intervalo_minutos: 10
    max_remocao_perc: 50
    sql: |
      SELECT * FROM (
        SELECT
          r.IDFILIAL       AS filial,
          r.NUMERORECEBER  AS titulo,
          r.SEQPARCELA     AS parcela,
          r.DOCTOCLIENTE   AS documento,
          r.NUMEROSAIDA    AS venda,
          CAST(r.DATAEMISSAO AS DATE) AS emissao,
          CAST(r.VENCIMENTO AS DATE)  AS vencimento,
          r.VALOR - COALESCE((SELECT SUM(rb.VALOR) FROM RECEBIDO rb
                               WHERE rb.IDFILIAL = r.IDFILIAL AND rb.NUMERORECEBER = r.NUMERORECEBER
                                 AND TRIM(rb.TIPO) IN ('1', '2', '3')), 0) AS valor,
          pt.DESCRICAOPORTADOR  AS forma,
          r.QRCODEPIXCOPIAECOLA AS pix_copia_e_cola,
          r.CODIGODEBARRAS      AS codigo_barras
        FROM RECEBER r
        LEFT JOIN PORTADOR pt ON pt.IDPORTADOR = r.IDPORTADOR
        WHERE r.STATUS IN ('0', '2')
      ) t
      WHERE t.valor > 0.009

  # Vendas válidas dos últimos 24 meses, com os itens em texto. Itens com
  # IDPRODUTOREFERENCIA são garantia estendida, não produto (VIEWFATURAMENTO).
  compra:
    chave: [filial, venda]
    intervalo_minutos: 30
    sql: |
      SELECT
        s.IDFILIAL      AS filial,
        s.NUMEROSAIDA   AS venda,
        s.DOCTOCLIENTE  AS documento,
        CAST(s.DATASAIDA AS DATE) AS data,
        s.VALTOTNOTA    AS total,
        s.NUMERONOTAFISCAL AS nota_fiscal,
        CASE WHEN s.ENTREGARADOMICILIO IN ('S', 'T') THEN 'S' ELSE 'N' END AS entrega_domicilio,
        CAST(s.DATAENTREGA AS DATE)  AS data_entrega,
        CAST(s.DATAMONTAGEM AS DATE) AS data_montagem,
        (SELECT LIST(CAST(CAST(i.QTDE AS INTEGER) AS VARCHAR(10)) || 'x ' || p.DESCRICAOPRODUTO
                     || CASE WHEN i.ENTREGUE IN ('S', 'T') THEN ' (entregue)' ELSE '' END, ' | ')
           FROM ITEMSAIDA i JOIN PRODUTO p ON p.IDPRODUTO = i.IDPRODUTO
          WHERE i.IDFILIAL = s.IDFILIAL AND i.NUMEROSAIDA = s.NUMEROSAIDA
            AND i.IDPRODUTOREFERENCIA IS NULL) AS itens,
        (SELECT COUNT(*) FROM ITEMSAIDA i
          WHERE i.IDFILIAL = s.IDFILIAL AND i.NUMEROSAIDA = s.NUMEROSAIDA
            AND i.IDPRODUTOREFERENCIA IS NULL
            AND COALESCE(i.ENTREGUE, 'F') NOT IN ('S', 'T')) AS itens_pendentes
      FROM SAIDA s
      WHERE s.STATUS = 'A'
        AND s.TIPOSAIDA IN ('1', '2', '9')
        AND s.DATASAIDA >= DATEADD(-24 MONTH TO CURRENT_DATE)

consultas:

  # ============================================================ DIAGNÓSTICO
  #
  # Pedir pelo Supabase:  POST /admin/comandos {"tipo": "consulta", "consulta": "diag_versao"}
  # e ler o resultado em  GET /admin/comandos/{id}  (o worker responde em até 30 s).

  diag_versao:
    descricao: Versão do Firebird, charset do banco e hora do servidor.
    params: []
    sql: |
      SELECT
        rdb$get_context('SYSTEM', 'ENGINE_VERSION') AS versao,
        (SELECT RDB$CHARACTER_SET_NAME FROM RDB$DATABASE) AS charset,
        CURRENT_TIMESTAMP AS agora
      FROM RDB$DATABASE

  diag_status:
    descricao: >
      Valores distintos dos campos de status usados nas consultas, com quantidade. Tabela que
      não aparece está vazia. Pode demorar alguns segundos.
    params: []
    sql: |
      SELECT CAST('RECEBER.STATUS' AS VARCHAR(40)) AS campo, r.STATUS AS valor, COUNT(*) AS qtde,
             SUM(r.VALOR) AS soma_valor, SUM(COALESCE(r.VALORPAGO, 0)) AS soma_pago,
             SUM(CASE WHEN r.VALORPAGO IS NULL THEN 1 ELSE 0 END) AS sem_valorpago
        FROM RECEBER r GROUP BY r.STATUS
      UNION ALL SELECT 'SAIDA.STATUSENTREGA', STATUSENTREGA, COUNT(*), NULL, NULL, NULL FROM SAIDA GROUP BY STATUSENTREGA
      UNION ALL SELECT 'PRODUTO.ATIVO', ATIVO, COUNT(*), NULL, NULL, NULL FROM PRODUTO GROUP BY ATIVO
      UNION ALL SELECT 'CLIENTE.ATIVO', ATIVO, COUNT(*), NULL, NULL, NULL FROM CLIENTE GROUP BY ATIVO
      ORDER BY 1, 3 DESC

  diag_receber:
    descricao: >
      Títulos emitidos nos últimos 2 anos agrupados por STATUS: vencimentos, quantos ainda vão
      vencer e quantos têm baixa (pagamento) na tabela RECEBIDO. Status com quase todos "com_baixa"
      = quitado; status com vencimentos futuros e sem baixa = em aberto.
    params: []
    sql: |
      SELECT
        r.STATUS AS status,
        COUNT(*) AS qtde,
        SUM(r.VALOR) AS soma_valor,
        MIN(CAST(r.VENCIMENTO AS DATE)) AS venc_mais_antigo,
        MAX(CAST(r.VENCIMENTO AS DATE)) AS venc_mais_novo,
        SUM(CASE WHEN r.VENCIMENTO >= CURRENT_DATE THEN 1 ELSE 0 END) AS a_vencer,
        SUM(CASE WHEN EXISTS (SELECT 1 FROM RECEBIDO rb
                               WHERE rb.IDFILIAL = r.IDFILIAL AND rb.NUMERORECEBER = r.NUMERORECEBER)
                 THEN 1 ELSE 0 END) AS com_baixa,
        SUM(CASE WHEN r.IDSUBSTITUICAO IS NOT NULL THEN 1 ELSE 0 END) AS com_substituicao
      FROM RECEBER r
      WHERE r.DATAEMISSAO >= CURRENT_DATE - 730
      GROUP BY r.STATUS
      ORDER BY 2 DESC

  diag_receber_amostra:
    descricao: >
      Até 5 títulos do último ano de cada STATUS, com cliente e valor, para conferir na tela do
      ERP o que cada status significa.
    params: []
    sql: |
      SELECT * FROM (SELECT FIRST 5 r.STATUS AS status, r.IDFILIAL AS filial, r.NUMERORECEBER AS titulo,
               r.DOCTOCLIENTE AS documento, c.NOMECLIENTE AS cliente, CAST(r.VENCIMENTO AS DATE) AS vencimento, r.VALOR AS valor
             FROM RECEBER r LEFT JOIN CLIENTE c ON c.DOCTOCLIENTE = r.DOCTOCLIENTE
             WHERE r.STATUS = '0' AND r.DATAEMISSAO >= CURRENT_DATE - 365 ORDER BY r.DATAEMISSAO DESC) a
      UNION ALL
      SELECT * FROM (SELECT FIRST 5 r.STATUS AS status, r.IDFILIAL AS filial, r.NUMERORECEBER AS titulo,
               r.DOCTOCLIENTE AS documento, c.NOMECLIENTE AS cliente, CAST(r.VENCIMENTO AS DATE) AS vencimento, r.VALOR AS valor
             FROM RECEBER r LEFT JOIN CLIENTE c ON c.DOCTOCLIENTE = r.DOCTOCLIENTE
             WHERE r.STATUS = '1' AND r.DATAEMISSAO >= CURRENT_DATE - 365 ORDER BY r.DATAEMISSAO DESC) b
      UNION ALL
      SELECT * FROM (SELECT FIRST 5 r.STATUS AS status, r.IDFILIAL AS filial, r.NUMERORECEBER AS titulo,
               r.DOCTOCLIENTE AS documento, c.NOMECLIENTE AS cliente, CAST(r.VENCIMENTO AS DATE) AS vencimento, r.VALOR AS valor
             FROM RECEBER r LEFT JOIN CLIENTE c ON c.DOCTOCLIENTE = r.DOCTOCLIENTE
             WHERE r.STATUS = '2' AND r.DATAEMISSAO >= CURRENT_DATE - 365 ORDER BY r.DATAEMISSAO DESC) c2
      UNION ALL
      SELECT * FROM (SELECT FIRST 5 r.STATUS AS status, r.IDFILIAL AS filial, r.NUMERORECEBER AS titulo,
               r.DOCTOCLIENTE AS documento, c.NOMECLIENTE AS cliente, CAST(r.VENCIMENTO AS DATE) AS vencimento, r.VALOR AS valor
             FROM RECEBER r LEFT JOIN CLIENTE c ON c.DOCTOCLIENTE = r.DOCTOCLIENTE
             WHERE r.STATUS = '6' AND r.DATAEMISSAO >= CURRENT_DATE - 365 ORDER BY r.DATAEMISSAO DESC) d
      UNION ALL
      SELECT * FROM (SELECT FIRST 5 r.STATUS AS status, r.IDFILIAL AS filial, r.NUMERORECEBER AS titulo,
               r.DOCTOCLIENTE AS documento, c.NOMECLIENTE AS cliente, CAST(r.VENCIMENTO AS DATE) AS vencimento, r.VALOR AS valor
             FROM RECEBER r LEFT JOIN CLIENTE c ON c.DOCTOCLIENTE = r.DOCTOCLIENTE
             WHERE r.STATUS = 'A' AND r.DATAEMISSAO >= CURRENT_DATE - 365 ORDER BY r.DATAEMISSAO DESC) e

  # FDC: TIPO da baixa 1 quitação, 2 parcial, 3 desconto, 4 juros, 8 encargos. Os colchetes
  # mostram se vem '1' ou '01' (a parcela abate TRIM(TIPO) IN ('1', '2', '3')).
  diag_recebido_tipo:
    descricao: >
      Baixas da RECEBIDO do último ano agrupadas por TIPO, com quantidade e soma.
    params: []
    sql: |
      SELECT '[' || rb.TIPO || ']' AS tipo, COUNT(*) AS qtde, SUM(rb.VALOR) AS soma_valor
      FROM RECEBIDO rb
      WHERE rb.DATA >= CURRENT_DATE - 365
      GROUP BY rb.TIPO
      ORDER BY 2 DESC

  diag_flags:
    descricao: >
      Valores dos campos sim/não usados nas consultas de produto e pagamento, e quantas linhas
      têm as tabelas de fator de parcelamento (se tiverem, o "sem juros" pode não ser real).
    params: []
    sql: |
      SELECT CAST('PRODUTO.FORADELINHA' AS VARCHAR(40)) AS campo, FORADELINHA AS valor, COUNT(*) AS qtde FROM PRODUTO GROUP BY FORADELINHA
      UNION ALL SELECT 'PRODUTO.PROMOCAO', PROMOCAO, COUNT(*) FROM PRODUTO GROUP BY PROMOCAO
      UNION ALL SELECT 'PRODUTO.NAOTEMDESCONTO', NAOTEMDESCONTO, COUNT(*) FROM PRODUTO GROUP BY NAOTEMDESCONTO
      UNION ALL SELECT 'PRODUTO.ATIVO com preco 0', ATIVO, COUNT(*) FROM PRODUTO WHERE COALESCE(PRECOAVISTA, 0) = 0 GROUP BY ATIVO
      UNION ALL SELECT 'GRUPO.PROIBIRDESCONTO', PROIBIRDESCONTO, COUNT(*) FROM GRUPO GROUP BY PROIBIRDESCONTO
      UNION ALL SELECT 'GRUPO com PERCDESCONTO > 0', CAST(NULL AS CHAR(1)), COUNT(*) FROM GRUPO WHERE PERCDESCONTO > 0
      UNION ALL SELECT 'CONDPGVENDA.ATIVO', ATIVO, COUNT(*) FROM CONDPGVENDA GROUP BY ATIVO
      UNION ALL SELECT 'SAIDA.ENTREGARADOMICILIO', ENTREGARADOMICILIO, COUNT(*) FROM SAIDA GROUP BY ENTREGARADOMICILIO
      ORDER BY 1, 3 DESC

  diag_views:
    descricao: >
      Código SQL das views e procedures VIEW* que o fornecedor do ERP indicou (VIEWPRODUTOS,
      VIEWESTOQUE, VIEWCLIENTES, VIEWFATURAMENTO). Lê só tabelas de sistema: não precisa de GRANT.
    max_linhas: 50
    params: []
    sql: |
      SELECT TRIM(r.RDB$RELATION_NAME) AS nome, CAST('VIEW' AS VARCHAR(10)) AS tipo, r.RDB$VIEW_SOURCE AS fonte
      FROM RDB$RELATIONS r
      WHERE r.RDB$VIEW_BLR IS NOT NULL AND r.RDB$RELATION_NAME STARTING WITH 'VIEW'
      UNION ALL
      SELECT TRIM(p.RDB$PROCEDURE_NAME), 'PROCEDURE', p.RDB$PROCEDURE_SOURCE
      FROM RDB$PROCEDURES p
      WHERE p.RDB$PROCEDURE_NAME STARTING WITH 'VIEW'
      ORDER BY 1

  diag_view_colunas:
    descricao: Colunas de uma view, ou parâmetros e colunas de uma procedure, pelo nome.
    params:
      - nome: nome
        tipo: texto
        obrigatorio: true
        exemplo: VIEWPRODUTOS
    sql: |
      SELECT CAST('coluna' AS VARCHAR(20)) AS tipo, rf.RDB$FIELD_POSITION AS pos, TRIM(rf.RDB$FIELD_NAME) AS nome
      FROM RDB$RELATION_FIELDS rf
      WHERE rf.RDB$RELATION_NAME = UPPER(CAST(:nome AS VARCHAR(63)))
      UNION ALL
      SELECT CASE WHEN pp.RDB$PARAMETER_TYPE = 0 THEN 'parametro entrada' ELSE 'coluna' END,
             pp.RDB$PARAMETER_NUMBER, TRIM(pp.RDB$PARAMETER_NAME)
      FROM RDB$PROCEDURE_PARAMETERS pp
      WHERE pp.RDB$PROCEDURE_NAME = UPPER(CAST(:nome AS VARCHAR(63)))
      ORDER BY 1, 2

  diag_estoque:
    descricao: >
      Compara as duas colunas de saldo da tabela ESTOQUE por filial: QTDER (a que o fornecedor
      usa na VIEWESTOQUE) e ESTOQUE. Só produtos ativos.
    params: []
    sql: |
      SELECT
        e.IDFILIAL AS filial,
        COUNT(*) AS produtos,
        SUM(CASE WHEN e.QTDER > 0 THEN 1 ELSE 0 END)   AS com_qtder,
        SUM(CASE WHEN e.ESTOQUE > 0 THEN 1 ELSE 0 END) AS com_estoque,
        SUM(CASE WHEN e.QTDER > 0 THEN e.QTDER ELSE 0 END)     AS soma_qtder,
        SUM(CASE WHEN e.ESTOQUE > 0 THEN e.ESTOQUE ELSE 0 END) AS soma_estoque
      FROM ESTOQUE e
      JOIN PRODUTO p ON p.IDPRODUTO = e.IDPRODUTO
      WHERE COALESCE(p.ATIVO, 'T') IN ('S', 'T')
      GROUP BY e.IDFILIAL
      ORDER BY 1

  diag_fotos:
    descricao: Quantas fotos de produto existem no banco, em que formato (binário, miniatura, URL) e o tamanho médio.
    params: []
    sql: |
      SELECT
        COUNT(*) AS fotos,
        COUNT(DISTINCT pf.IDPRODUTO) AS produtos_com_foto,
        COUNT(DISTINCT CASE WHEN COALESCE(p.ATIVO, 'T') IN ('S', 'T') THEN pf.IDPRODUTO END) AS produtos_ativos_com_foto,
        SUM(CASE WHEN pf.FOTO IS NOT NULL THEN 1 ELSE 0 END) AS com_foto_binaria,
        SUM(CASE WHEN pf.MINIATURA IS NOT NULL THEN 1 ELSE 0 END) AS com_miniatura,
        SUM(CASE WHEN pf.URL_FOTO IS NOT NULL THEN 1 ELSE 0 END) AS com_url,
        AVG(OCTET_LENGTH(pf.FOTO)) AS tamanho_medio_bytes,
        MAX(OCTET_LENGTH(pf.FOTO)) AS tamanho_maximo_bytes
      FROM PRODUTOFOTO pf
      LEFT JOIN PRODUTO p ON p.IDPRODUTO = pf.IDPRODUTO

  diag_fotos_amostra:
    descricao: Até 10 fotos de produtos ativos, com nome do arquivo, URL e tamanho.
    max_linhas: 10
    params: []
    sql: |
      SELECT FIRST 10
        pf.IDPRODUTO AS codigo, p.DESCRICAOPRODUTO AS produto, pf.SEQ AS seq,
        pf.NOMEARQUIVO AS arquivo, pf.URL_FOTO AS url,
        OCTET_LENGTH(pf.FOTO) AS bytes_foto, OCTET_LENGTH(pf.MINIATURA) AS bytes_miniatura
      FROM PRODUTOFOTO pf
      JOIN PRODUTO p ON p.IDPRODUTO = pf.IDPRODUTO
      WHERE COALESCE(p.ATIVO, 'T') IN ('S', 'T')
      ORDER BY pf.IDPRODUTO DESC

  diag_amostra_clientes:
    descricao: Últimos 10 clientes cadastrados, para ver como CPF e telefones são gravados.
    params: []
    sql: |
      SELECT FIRST 10 DOCTOCLIENTE AS documento, NOMECLIENTE AS nome, CELULAR AS celular,
             TELEFONES AS telefones, TELEFONEALTERNATIVO AS alternativo, CAST(DATACADASTRO AS DATE) AS cadastro
      FROM CLIENTE
      ORDER BY DATACADASTRO DESC NULLS LAST

  diag_amostra_produtos:
    descricao: Últimos 10 produtos cadastrados, para ver se a descrição tem acento e como é escrita.
    params: []
    sql: |
      SELECT FIRST 10 IDPRODUTO AS codigo, DESCRICAOPRODUTO AS descricao, PRECOAVISTA AS preco_avista,
             PRECOAPRAZO AS preco_aprazo, ATIVO AS ativo, CAST(DATACADASTRO AS DATE) AS cadastro
      FROM PRODUTO
      ORDER BY DATACADASTRO DESC NULLS LAST

  diag_indices:
    descricao: >
      Índices das tabelas consultadas por cliente. Sem índice em DOCTOCLIENTE, as consultas por
      CPF varrem a tabela inteira (funciona, mas fica mais lento).
    params: []
    sql: |
      SELECT
        TRIM(i.RDB$RELATION_NAME) AS tabela,
        TRIM(i.RDB$INDEX_NAME)    AS indice,
        LIST(TRIM(s.RDB$FIELD_NAME), ', ') AS colunas
      FROM RDB$INDICES i
      JOIN RDB$INDEX_SEGMENTS s ON s.RDB$INDEX_NAME = i.RDB$INDEX_NAME
      WHERE i.RDB$RELATION_NAME IN ('CLIENTE', 'TELEFONES', 'RECEBER', 'PEDIDOVENDA', 'SAIDA',
                                    'ASSISTENCIA', 'ESTOQUE', 'PRODUTOPROMOCAO')
      GROUP BY 1, 2
      ORDER BY 1, 2
