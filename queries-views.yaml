# Versão do queries.yaml que lê SÓ as views que a FDC liberou para o usuário FDCRELATORIO
# (VIEWPRODUTOS, VIEWESTOQUE, VIEWCLIENTES, VIEWFATURAMENTO), sem GRANT nas tabelas.
# Para usar: copiar por cima do queries.yaml da pasta do worker (é relido sozinho).
# Quando a FDC der SELECT nas tabelas (deploy/usuario_leitura.sql), volte para o queries.yaml.
#
# O que fica de fora (as tabelas no Supabase ficam paradas no último dado que receberam):
#   promocao, foto, condicao, condicao_fator, loja, parcela, compra.
#   ATENÇÃO: parcela (títulos em aberto) congela; não usar para cobrança enquanto valer este arquivo.
# Colunas que as views não têm vão como NULL (fdc.aplicar troca a linha inteira).
# As regras de Firebird do queries.yaml valem aqui também.

sincronizar:

  # VIEWPRODUTOS já filtra ATIVO = 'T'. Sem PRECOAPRAZO, promoção do cadastro, montagem e o
  # "sem desconto" do produto/grupo.
  # atalho: sem_desconto = 'S' em tudo (a view não diz quais produtos proíbem desconto, então
  # negociar_preco não dá desconto em nada). Trocar por NULL libera o desconto padrão da loja
  # em todos, inclusive nos que o ERP proíbe.
  produto:
    chave: [codigo]
    intervalo_minutos: 10
    sql: |
      SELECT
        p.IDPRODUTO        AS codigo,
        p.DESCRICAOPRODUTO AS descricao,
        p.NOMEFABRICANTE   AS marca,
        p.NOMEGRUPO        AS grupo,
        p.NOMESUBGRUPO     AS subgrupo,
        p.EAN              AS ean,
        p.PRECOVENDA       AS preco_avista,
        p.ALTURA           AS altura,
        p.LARGURA          AS largura,
        p.COMPRIMENTO      AS comprimento,
        'N'                AS aceita_desconto,
        'S'                AS sem_desconto
      FROM VIEWPRODUTOS p

  # Só saldos > 0 de produtos ativos (os que estão na VIEWPRODUTOS).
  estoque:
    chave: [codigo, filial]
    intervalo_minutos: 5
    sql: |
      SELECT e.IDPRODUTO AS codigo, e.IDFILIAL AS filial, e.QTDER AS estoque
      FROM VIEWESTOQUE e
      JOIN VIEWPRODUTOS p ON p.IDPRODUTO = e.IDPRODUTO
      WHERE e.QTDER > 0

  # Sem endereço completo, última compra, limite, situação e a tabela TELEFONES.
  cliente:
    chave: [documento]
    intervalo_minutos: 30
    sql: |
      SELECT
        c.DOCTOCLIENTE        AS documento,
        c.NOMECLIENTE         AS nome,
        c.EMAIL               AS email,
        c.CELULAR             AS celular,
        c.TELEFONES           AS telefones,
        c.TELEFONEALTERNATIVO AS telefone_alternativo,
        c.BAIRRO              AS bairro,
        CAST(c.DATACADASTRO AS DATE) AS cliente_desde
      FROM VIEWCLIENTES c
      WHERE c.DOCTOCLIENTE IS NOT NULL

  # compra: volta quando soubermos as colunas da VIEWFATURAMENTO deste servidor
  # (a da cópia de 23/10 tem NUMEROSAIDA; a do servidor não).

consultas:

  diag_versao:
    descricao: Versão do Firebird, charset do banco e hora do servidor.
    params: []
    sql: |
      SELECT
        rdb$get_context('SYSTEM', 'ENGINE_VERSION') AS versao,
        (SELECT RDB$CHARACTER_SET_NAME FROM RDB$DATABASE) AS charset,
        CURRENT_TIMESTAMP AS agora
      FROM RDB$DATABASE

  diag_views:
    descricao: Código SQL das views e procedures VIEW* do fornecedor do ERP.
    max_linhas: 50
    params: []
    sql: |
      SELECT TRIM(r.RDB$RELATION_NAME) AS nome, CAST('VIEW' AS VARCHAR(10)) AS tipo, r.RDB$VIEW_SOURCE AS fonte
      FROM RDB$RELATIONS r
      WHERE r.RDB$VIEW_BLR IS NOT NULL AND r.RDB$RELATION_NAME STARTING WITH 'VIEW'
      UNION ALL
      SELECT TRIM(p.RDB$PROCEDURE_NAME), 'PROCEDURE', p.RDB$PROCEDURE_SOURCE
      FROM RDB$PROCEDURES p
      WHERE p.RDB$PROCEDURE_NAME STARTING WITH 'VIEW'
      ORDER BY 1

  diag_view_colunas:
    descricao: Colunas de uma view, ou parâmetros e colunas de uma procedure, pelo nome.
    params:
      - nome: nome
        tipo: texto
        obrigatorio: true
        exemplo: VIEWPRODUTOS
    sql: |
      SELECT CAST('coluna' AS VARCHAR(20)) AS tipo, rf.RDB$FIELD_POSITION AS pos, TRIM(rf.RDB$FIELD_NAME) AS nome
      FROM RDB$RELATION_FIELDS rf
      WHERE rf.RDB$RELATION_NAME = UPPER(CAST(:nome AS VARCHAR(63)))
      UNION ALL
      SELECT CASE WHEN pp.RDB$PARAMETER_TYPE = 0 THEN 'parametro entrada' ELSE 'coluna' END,
             pp.RDB$PARAMETER_NUMBER, TRIM(pp.RDB$PARAMETER_NAME)
      FROM RDB$PROCEDURE_PARAMETERS pp
      WHERE pp.RDB$PROCEDURE_NAME = UPPER(CAST(:nome AS VARCHAR(63)))
      ORDER BY 1, 2
